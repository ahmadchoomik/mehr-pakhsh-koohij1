<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهر پخش کوهیج</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f7f5;margin:0;color:#17231c}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #ccd6cf;border-radius:10px}button{cursor:pointer;background:#166534;color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:#68736d}.danger{background:#b91c1c}.secondary{background:#475569}.product{border:1px solid #e1e8e3;padding:12px;border-radius:14px}.product img{width:100%;height:180px;object-fit:contain;background:#f8faf9;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none}.stat{font-size:28px;font-weight:700}.nav{position:sticky;top:0;background:#ffffffee;padding:10px;z-index:4;border-bottom:1px solid #ddd}.nav button{background:#e8f2eb;color:#14532d}.nav button.active{background:#166534;color:#fff}label{display:block;margin:8px 0 5px;font-weight:700}.full{width:100%;box-sizing:border-box}h1,h2,h3{margin-top:0}.small{font-size:12px}.preview{max-width:120px;max-height:120px}</style></head><body><div class="nav"><div class="wrap row"><button onclick="show('dashboard')">داشبورد</button><button onclick="show('products')">کالاها</button><button onclick="show('categories')">دسته‌بندی</button><button onclick="show('export')">PDF / JSON</button><button onclick="show('settings')">تنظیمات</button></div></div><main class="wrap">
<section id="dashboard"><div class="card"><h1>مهر پخش کوهیج</h1><p class="muted">کاتالوگ و مدیریت اطلاعات کالا</p><div id="stats" class="grid"></div></div><div class="card"><h2>وضعیت انقضا</h2><div id="expiryList" class="grid"></div></div></section>
<section id="products" class="hide"><div class="card"><div class="row"><h2>کالاها</h2><button onclick="openProduct()">+ کالای جدید</button><input id="search" placeholder="جستجوی کالا..." oninput="renderProducts()"></div><div id="productsList" class="grid"></div></div></section>
<section id="categories" class="hide"><div class="card"><div class="row"><h2>دسته‌بندی‌ها</h2><button onclick="addCategory()">+ دسته جدید</button></div><div id="catList" class="grid"></div></div></section>
<section id="export" class="hide"><div class="card"><h2>خروجی و پشتیبان</h2><div class="row"><button onclick="downloadJSON()">ساخت فایل پشتیبان JSON</button><button class="secondary" onclick="document.getElementById('file').click()">ورود JSON</button><input id="file" type="file" accept="application/json,.json" class="hide" onchange="importJSON(event)"></div><hr><h3>خروجی PDF کاتالوگ</h3><label>محصولات انتخابی</label><div id="exportProducts" class="grid"></div><div class="row"><label><input id="pdfImage" type="checkbox" checked> عکس</label><label><input id="pdfCompany" type="checkbox" checked> تولیدکننده</label><label><input id="pdfPrice" type="checkbox" checked> قیمت مصرف‌کننده</label><label><input id="pdfExpiry" type="checkbox" checked> تاریخ انقضا</label><label><input id="pdfHideUnavailable" type="checkbox" checked> حذف ناموجودها</label></div><button onclick="makePDF()">ساخت PDF</button></div></section>
<section id="settings" class="hide"><div class="card"><h2>تنظیمات</h2><label>نام شرکت</label><input id="company" class="full"><label>تلفن</label><input id="phone" class="full"><label>آدرس</label><input id="address" class="full"><label>نزدیک، چند روز مانده به انقضا؟</label><input id="near" type="number" class="full"><label>خیلی نزدیک، چند روز مانده؟</label><input id="veryNear" type="number" class="full"><label>لوگو</label><input id="logo" type="file" accept="image/*"><button onclick="saveSettings()">ذخیره تنظیمات</button><p class="small muted">سازنده: Ahmad.choomik</p></div></section></main>
<dialog id="dlg"><form method="dialog" onsubmit="return saveProduct(event)"><h2>کالا</h2><input type="hidden" id="pid"><label>نام کالا</label><input id="pname" class="full" required><label>دسته‌بندی</label><select id="pcat" class="full"></select><label>قیمت مصرف‌کننده</label><input id="pprice" type="number" class="full"><label>تولیدکننده / شرکت</label><input id="pcompany" class="full"><label>کد کالا</label><input id="pcode" class="full"><label>توضیحات</label><textarea id="pdesc" class="full"></textarea><label>تاریخ انقضا (شمسی)</label><div class="row"><input id="jy" type="number" placeholder="سال" required><input id="jm" type="number" placeholder="ماه" min="1" max="12" required><input id="jd" type="number" placeholder="روز" min="1" max="31" required></div><label>وضعیت</label><select id="pstatus" class="full"><option value="available">موجود</option><option value="unavailable">ناموجود</option></select><label>عکس</label><input id="pimg" type="file" accept="image/*"><div class="row" style="margin-top:15px"><button type="submit">ذخیره</button><button type="button" class="secondary" onclick="dlg.close()">لغو</button></div></form></dialog>
<script>
const K={p:'mkp_products_db',c:'mkp_categories_db',s:'mkp_settings_db'};const defS={companyName:'مهر پخش کوهیج',phone:'',address:'',logo:'',nearDays:30,veryNearDays:20};let products=JSON.parse(localStorage.getItem(K.p)||'[]'),cats=JSON.parse(localStorage.getItem(K.c)||'[]'),settings={...defS,...JSON.parse(localStorage.getItem(K.s)||'{}')};
if(!cats.length)cats=['نوشیدنی‌ها','تنقلات','شوینده'];function save(){localStorage.setItem(K.p,JSON.stringify(products));localStorage.setItem(K.c,JSON.stringify(cats));localStorage.setItem(K.s,JSON.stringify(settings))}function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');if(id==='dashboard')renderDash();if(id==='products')renderProducts();if(id==='categories')renderCats();if(id==='export')renderExport();if(id==='settings')loadSettings()}
function leap(y){let a=((y-474)%2820+2820)%2820+474;return ((((a+38)*682)%2816)<682)}function mdays(y,m){return m<=6?31:m<=11?30:leap(y)?30:29}function validJ(y,m,d){return y>0&&m>=1&&m<=12&&d>=1&&d<=mdays(y,m)}function gDate(y,m,d){let gy=y+621;let epbase=y-(y>=0?474:473),epyear=474+(epbase%2820);let md=m<=7?(m-1)*31:(m-1)*30+6;let jdn=d+md+Math.floor((epyear*682-110)/2816)+(epyear-1)*365+Math.floor(epbase/2820)*1029983+1948320-1;let b=jdn+68569,n=Math.floor(4*b/146097);b=b-Math.floor((146097*n+3)/4);let y2=Math.floor(4000*(b+1)/1461001);b=b-Math.floor(1461*y2/4)+31;let m2=Math.floor(80*b/2447);let d2=b-Math.floor(2447*m2/80);b=Math.floor(m2/11);m2=m2+2-12*b;y2=100*(n-49)+y2+b;return new Date(Date.UTC(y2,m2-1,d2))}function diff(p){if(!p.expiry)return null;let t=gDate(p.expiry.jy,p.expiry.jm,p.expiry.jd),n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000)}function st(p){let d=diff(p);if(d===null)return'safe';if(d<0)return'expired';if(d<=+settings.veryNearDays)return'very_near';if(d<=+settings.nearDays)return'near';return'safe'}function stFa(x){return{x:'',safe:'ایمن',near:'نزدیک',very_near:'خیلی نزدیک',expired:'منقضی'}[x]||x}
function renderDash(){let a=products.filter(p=>p.status!=='unavailable');let c={safe:0,near:0,very_near:0,expired:0};products.forEach(p=>c[st(p)]++);document.getElementById('stats').innerHTML=[['کل کالاها',products.length],['موجود',a.length],['ناموجود',products.length-a.length],['منقضی',c.expired]].map(x=>`<div class="card"><div>${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('');document.getElementById('expiryList').innerHTML=Object.entries(c).map(([k,v])=>`<div class="card"><b>${stFa(k)}</b><div class="stat">${v}</div></div>`).join('')}
function renderProducts(){let q=(document.getElementById('search')?.value||'').toLowerCase();document.getElementById('productsList').innerHTML=products.filter(p=>(p.name||'').toLowerCase().includes(q)).map(p=>`<div class="product">${p.image?`<img src="${p.image}">`:''}<h3>${p.name}</h3><div>${cats[p.category]||p.category||'بدون دسته'}</div><div>${p.price||'-'} تومان</div><div>${p.expiry?.jy}/${p.expiry?.jm}/${p.expiry?.jd} · ${stFa(st(p))}</div><div class="row"><button onclick="openProduct('${p.id}')">ویرایش</button><button class="danger" onclick="delProduct('${p.id}')">حذف</button></div></div>`).join('')||'<p>کالایی ثبت نشده.</p>'}
function renderCats(){document.getElementById('catList').innerHTML=cats.map((c,i)=>`<div class="card"><b>${c}</b><div class="row"><button onclick="renameCat(${i})">ویرایش</button><button class="danger" onclick="delCat(${i})">حذف</button></div></div>`).join('')}
function addCategory(){let x=prompt('نام دسته‌بندی');if(x?.trim()){cats.push(x.trim());save();renderCats()}}function renameCat(i){let x=prompt('نام جدید',cats[i]);if(x?.trim()){cats[i]=x.trim();save();renderCats();renderProducts()}}function delCat(i){if(confirm('دسته حذف شود؟')){cats.splice(i,1);save();renderCats()}}
function openProduct(id){document.querySelector('#pcat').innerHTML=cats.map((x,i)=>`<option value="${i}">${x}</option>`).join('');let p=products.find(x=>x.id===id)||{};for(let [k,v] of [['pid',p.id||'' ],['pname',p.name||''],['pprice',p.price||''],['pcompany',p.company||''],['pcode',p.code||''],['pdesc',p.description||''],['jy',p.expiry?.jy||''],['jm',p.expiry?.jm||''],['jd',p.expiry?.jd||'']])document.getElementById(k).value=v;document.getElementById('pcat').value=p.category??0;document.getElementById('pstatus').value=p.status||'available';document.getElementById('pimg').value='';document.getElementById('dlg').showModal()}
function saveProduct(e){e.preventDefault();let y=+jy.value,m=+jm.value,d=+jd.value;if(!validJ(y,m,d)){alert('تاریخ شمسی نامعتبر است');return false}let p={id:pid.value||crypto.randomUUID(),name:pname.value.trim(),category:+pcat.value,price:+pprice.value||0,company:pcompany.value.trim(),code:pcode.value.trim(),description:pdesc.value.trim(),expiry:{jy:y,jm:m,jd:d},status:pstatus.value,image:(products.find(x=>x.id===pid.value)||{}).image||''};let f=pimg.files[0];if(f){let r=new FileReader();r.onload=()=>{p.image=r.result;upsert(p)};r.readAsDataURL(f)}else upsert(p);return false}function upsert(p){let i=products.findIndex(x=>x.id===p.id);if(i<0)products.push(p);else products[i]=p;save();dlg.close();renderProducts();renderDash()}
function delProduct(id){if(confirm('کالا حذف شود؟')){products=products.filter(x=>x.id!==id);save();renderProducts();renderDash()}}
function loadSettings(){company.value=settings.companyName;phone.value=settings.phone;address.value=settings.address;near.value=settings.nearDays;veryNear.value=settings.veryNearDays}function saveSettings(){settings.companyName=company.value.trim()||'مهر پخش کوهیج';settings.phone=phone.value;settings.address=address.value;settings.nearDays=Math.max(1,+near.value||30);settings.veryNearDays=Math.max(1,+veryNear.value||20);let f=logo.files[0];if(f){let r=new FileReader();r.onload=()=>{settings.logo=r.result;save();alert('ذخیره شد')};r.readAsDataURL(f)}else{save();alert('ذخیره شد')}}
function buildBackup(){return{app:'MEHR_PAK_KOUHIJ',format:'MKP-JSON',version:'2.0',backupDate:new Date().toISOString(),products,categories:cats,settings}}function downloadJSON(){let b=new Blob([JSON.stringify(buildBackup(),null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mehr-pakhsh-koohij-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.app!=='MEHR_PAK_KOUHIJ'||!Array.isArray(d.products)||!Array.isArray(d.categories)||!d.settings)throw Error();products=d.products;cats=d.categories;settings={...defS,...d.settings};save();renderProducts();renderDash();alert('پشتیبان با موفقیت وارد شد')}catch(x){alert('فایل پشتیبان معتبر نیست')}};r.readAsText(f);e.target.value=''}
function renderExport(){document.getElementById('exportProducts').innerHTML=products.map(p=>`<label class="product"><input type="checkbox" class="ex" value="${p.id}" checked> ${p.name} <small>(${p.status==='available'?'موجود':'ناموجود'})</small></label>`).join('')||'<p>کالایی نیست.</p>'}
function makePDF(){let ids=[...document.querySelectorAll('.ex:checked')].map(x=>x.value),ps=products.filter(p=>ids.includes(p.id)&&(!pdfHideUnavailable.checked||p.status==='available'));if(!ps.length)return alert('هیچ کالایی برای PDF انتخاب نشده');let w=window.open('','_blank');if(!w)return alert('مرورگر پنجره جدید را مسدود کرده است');let pages=ps.map(p=>`<article class="page"><header><strong>${settings.companyName}</strong>${settings.logo?`<img src="${settings.logo}">`:''}</header><h1>${p.name}</h1>${pdfImage.checked&&p.image?`<img class="pic" src="${p.image}">`:''}<div class="box"><b>دسته:</b> ${cats[p.category]||'بدون دسته'}</div>${pdfCompany.checked?`<div class="box"><b>تولیدکننده:</b> ${p.company||'-'}</div>`:''}${pdfPrice.checked?`<div class="box"><b>قیمت مصرف‌کننده:</b> ${Number(p.price||0).toLocaleString('fa-IR')} تومان</div>`:''}${pdfExpiry.checked?`<div class="box"><b>تاریخ انقضا:</b> ${p.expiry.jy}/${p.expiry.jm}/${p.expiry.jd} · ${stFa(st(p))}</div>`:''}<div class="box"><b>وضعیت:</b> ${p.status==='available'?'موجود':'ناموجود'}</div>${p.description?`<p>${p.description}</p>`:''}<footer>${settings.phone||''} ${settings.address?' | '+settings.address:''}<br>Ahmad.choomik</footer></article>`).join('');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${settings.companyName}</title><style>@page{size:A4;margin:0}body{margin:0;font-family:Tahoma,Arial;background:#ddd}.page{box-sizing:border-box;width:210mm;min-height:297mm;background:#fff;margin:0 auto 8mm;padding:18mm;position:relative;page-break-after:always;color:#18231c}header{height:28mm;border-bottom:2px solid #166534;display:flex;align-items:center;justify-content:space-between;font-size:22px}header img{max-height:22mm;max-width:35mm}h1{font-size:27px;margin:15mm 0 8mm}.pic{display:block;width:100%;height:105mm;object-fit:contain;margin:auto}.box{border:1px solid #d7e0da;border-radius:10px;padding:5mm;margin:4mm 0;background:#f7faf8}footer{position:absolute;bottom:12mm;left:18mm;right:18mm;border-top:1px solid #ddd;padding-top:4mm;font-size:11px;color:#68736d;text-align:center}@media print{body{background:#fff}.page{margin:0}}</style></head><body>${pages}</body></html>`);w.document.close();setTimeout(()=>w.print(),700)}
renderDash();
</script></body></html>
